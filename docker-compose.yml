x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/${POSTGRES_DB_AIRFLOW:-airflow_meta}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-46BKJoKc-CtANjlbbbDWgrMvaJ34GWA7oAq6_qGCmTZ=}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__CORE__SECRET_KEY:-koridortj_secret_key_1234567890abcdef}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    # Project specific env vars
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB_WAREHOUSE: ${POSTGRES_DB_WAREHOUSE:-warehouse}
    POSTGRES_INGESTION_USER: ${POSTGRES_INGESTION_USER:-ingestion_user}
    POSTGRES_INGESTION_PASSWORD: ${POSTGRES_INGESTION_PASSWORD:-ingestion_dev_password}
    PYTHONPATH: /opt/airflow
    _PIP_ADDITIONAL_REQUIREMENTS: "dbt-core>=1.8.0 dbt-postgres>=1.8.0 pydantic>=2.7.0 requests>=2.32.0 python-dotenv>=1.0.1"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
  networks:
    - koridortj-network

services:
  postgres:
    image: postgres:16-alpine
    container_name: koridortj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_WAREHOUSE:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_WAREHOUSE:-warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - koridortj-network

  airflow-init:
    <<: *airflow-common
    container_name: koridortj-airflow-init
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create \
        --username admin \
        --firstname Admin \
        --lastname User \
        --role Admin \
        --email admin@example.com \
        --password admin || true
      "
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: koridortj-airflow-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: koridortj-airflow-scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
    name: koridortj_postgres_data

networks:
  koridortj-network:
    name: koridortj-network
    driver: bridge
