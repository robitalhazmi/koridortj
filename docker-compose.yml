x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/${POSTGRES_DB_AIRFLOW:-airflow_meta}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-46BKJoKc-CtANjlbbbDWgrMvaJ34GWA7oAq6_qGCmTZ=}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__CORE__SECRET_KEY:-koridortj_secret_key_1234567890abcdef}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    # Project specific env vars
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB_WAREHOUSE: ${POSTGRES_DB_WAREHOUSE:-warehouse}
    POSTGRES_INGESTION_USER: ${POSTGRES_INGESTION_USER:-ingestion_user}
    POSTGRES_INGESTION_PASSWORD: ${POSTGRES_INGESTION_PASSWORD:-ingestion_dev_password}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    PYTHONPATH: /opt/airflow
    _PIP_ADDITIONAL_REQUIREMENTS: "dbt-core>=1.8.0 dbt-postgres>=1.8.0 pydantic>=2.7.0 requests>=2.32.0 python-dotenv>=1.0.1 kafka-python-ng>=2.2.0"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
  networks:
    - koridortj-network

services:
  postgres:
    image: postgres:16-alpine
    container_name: koridortj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_WAREHOUSE:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_WAREHOUSE:-warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - koridortj-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: koridortj-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - koridortj-network

  airflow-init:
    <<: *airflow-common
    container_name: koridortj-airflow-init
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create \
        --username admin \
        --firstname Admin \
        --lastname User \
        --role Admin \
        --email admin@example.com \
        --password admin || true
      "
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: koridortj-airflow-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  airflow-scheduler:
    <<: *airflow-common
    container_name: koridortj-airflow-scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  superset-init:
    image: apache/superset:4.0.1
    container_name: koridortj-superset-init
    user: "0"
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-koridortj_superset_secret_key_9876543210abcdef}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB_SUPERSET: ${POSTGRES_DB_SUPERSET:-superset_meta}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@koridortj.id}
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/superset_init.sh:/app/docker-init.sh:ro
      - superset_home:/app/superset_home
    entrypoint: ["/bin/bash", "/app/docker-init.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - koridortj-network

  superset:
    image: apache/superset:4.0.1
    container_name: koridortj-superset
    restart: unless-stopped
    user: "0"
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-koridortj_superset_secret_key_9876543210abcdef}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB_SUPERSET: ${POSTGRES_DB_SUPERSET:-superset_meta}
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home
    ports:
      - "8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - koridortj-network

  token-service:
    build:
      context: .
      dockerfile: services/guest_token_service/Dockerfile
    container_name: koridortj-token-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB_WAREHOUSE: ${POSTGRES_DB_WAREHOUSE:-warehouse}
      POSTGRES_READONLY_USER: ${POSTGRES_READONLY_USER:-superset_ro}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-superset_ro_dev_password}
      SUPERSET_DOMAIN: ${SUPERSET_DOMAIN:-http://localhost:8088}
      SUPERSET_DASHBOARD_ID: ${SUPERSET_DASHBOARD_ID:-45d44fda-4e9c-4a88-894d-819f66fbfd33}
      SUPERSET_GUEST_TOKEN_JWT_SECRET: ${SUPERSET_GUEST_TOKEN_JWT_SECRET:-koridortj_guest_token_jwt_secret_abcdef123456}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - koridortj-network

  replay-producer:
    build:
      context: .
      dockerfile: docker/Dockerfile.producer
    container_name: koridortj-replay-producer
    restart: unless-stopped
    profiles:
      - streaming
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_RAW: taps.raw
      REPLAY_SPEED_MULTIPLIER: "60.0"
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - koridortj-network

  tap-consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.consumer
    container_name: koridortj-tap-consumer
    restart: unless-stopped
    profiles:
      - streaming
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_RAW: taps.raw
      KAFKA_TOPIC_DLQ: taps.deadletter
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB_WAREHOUSE: ${POSTGRES_DB_WAREHOUSE:-warehouse}
      POSTGRES_INGESTION_USER: ${POSTGRES_INGESTION_USER:-ingestion_user}
      POSTGRES_INGESTION_PASSWORD: ${POSTGRES_INGESTION_PASSWORD:-ingestion_dev_password}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - koridortj-network

volumes:
  postgres_data:
    name: koridortj_postgres_data
  superset_home:
    name: koridortj_superset_home

networks:
  koridortj-network:
    name: koridortj-network
    driver: bridge
