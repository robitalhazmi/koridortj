name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main]
    types:
      - completed
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-images:
    name: Build & Push GHCR Container Images
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Owner for Docker Tag
        id: repo_meta
        run: |
          echo "owner_lc=${OWNER,,}" >> "${GITHUB_OUTPUT}"
        env:
          OWNER: '${{ github.repository_owner }}'

      # 1. Token Service / Web Portal Image
      - name: Build and Push Token Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/guest_token_service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_meta.outputs.owner_lc }}/koridortj-token-service:latest
            ghcr.io/${{ steps.repo_meta.outputs.owner_lc }}/koridortj-token-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Replay Producer Image
      - name: Build and Push Replay Producer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.producer
          push: true
          tags: |
            ghcr.io/${{ steps.repo_meta.outputs.owner_lc }}/koridortj-replay-producer:latest
            ghcr.io/${{ steps.repo_meta.outputs.owner_lc }}/koridortj-replay-producer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Tap Consumer Image
      - name: Build and Push Tap Consumer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.consumer
          push: true
          tags: |
            ghcr.io/${{ steps.repo_meta.outputs.owner_lc }}/koridortj-tap-consumer:latest
            ghcr.io/${{ steps.repo_meta.outputs.owner_lc }}/koridortj-tap-consumer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Custom Airflow Image (with dbt pre-installed)
      - name: Build and Push Custom Airflow
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.airflow
          push: true
          tags: |
            ghcr.io/${{ steps.repo_meta.outputs.owner_lc }}/koridortj-airflow:latest
            ghcr.io/${{ steps.repo_meta.outputs.owner_lc }}/koridortj-airflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Serving Superset Image (with baked-in config and entrypoint)
      - name: Build and Push Superset Serving Node
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.superset
          push: true
          tags: |
            ghcr.io/${{ steps.repo_meta.outputs.owner_lc }}/koridortj-superset:latest
            ghcr.io/${{ steps.repo_meta.outputs.owner_lc }}/koridortj-superset:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-coolify:
    name: Trigger Coolify Zero-Downtime Deployment
    runs-on: ubuntu-latest
    needs: [build-and-push-images]
    steps:
      - name: Trigger Coolify API / Webhook Redeploy
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_FQDN: ${{ secrets.COOLIFY_FQDN }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
        run: |
          if [ -n "$COOLIFY_WEBHOOK_URL" ]; then
            echo "Triggering deployment via Coolify Webhook..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "$COOLIFY_WEBHOOK_URL")
            HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
            echo "Webhook response status: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Deployment triggered successfully on Coolify VPS via Webhook!"
            else
              echo "⚠️ Warning: Coolify webhook returned status $HTTP_CODE"
            fi
          elif [ -n "$COOLIFY_API_TOKEN" ] && [ -n "$COOLIFY_RESOURCE_UUID" ]; then
            COOLIFY_URL="${COOLIFY_FQDN:-https://app.coolify.io}"
            echo "Triggering deployment via Coolify REST API (${COOLIFY_URL})..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
              -X POST "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_RESOURCE_UUID}" \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              -H "Content-Type: application/json")
            HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
            echo "API response status: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Deployment triggered successfully on Coolify VPS via API!"
            else
              echo "⚠️ Warning: Coolify API returned status $HTTP_CODE"
            fi
          else
            echo "ℹ️ Neither COOLIFY_WEBHOOK_URL nor COOLIFY_API_TOKEN is configured in GitHub Secrets."
            echo "   Serving-layer images were successfully built and published to GHCR."
            echo "   To enable automated VPS redeploys, add COOLIFY_WEBHOOK_URL or COOLIFY_API_TOKEN to repository secrets."
          fi
